<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tool · HP4PS</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body data-page="tools" class="catalog-page">
  <header class="topbar">
    <a class="brand" href="./" data-page="home">HP4PS</a>
    <nav class="nav">
      <a href="skills.html" data-page="skills" data-i18n="nav.skills"></a>
      <a href="tools.html" data-page="tools" data-i18n="nav.tools"></a>
      <a href="benchmark.html" data-page="benchmark" data-i18n="nav.benchmark"></a>
    </nav>
    <button class="lang" id="lang-toggle" type="button">中文</button>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-inner">
        <p class="sidebar-title" data-i18n="catalog.categories"></p>
        <input class="tree-filter" id="tree-filter" type="search" data-i18n-placeholder="catalog.filter">
        <nav class="tree" id="tree"></nav>
      </div>
    </aside>
    <div class="backdrop" id="backdrop"></div>

    <main class="content">
      <button class="sidebar-toggle" id="sidebar-toggle" type="button" data-i18n="catalog.categories"></button>
      <nav class="crumbs" id="crumbs"></nav>
      <h1 data-i18n="tools.title"></h1>
      <p class="lead" data-i18n="tools.body"></p>
      <div id="category-card"></div>
      <div id="catalog"></div>
    </main>
  </div>

  <footer class="footer"><p data-i18n="footer.text"></p></footer>
</body>
</html>
