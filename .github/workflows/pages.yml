name: Deploy homepage

on:
  push:
    branches: [main]
    paths: ['homepage/**', 'references/taxonomy/**', 'scripts/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/verify_i18n.py
      - name: taxonomy.json matches its source tables
        run: python3 scripts/build_taxonomy.py && git diff --exit-code homepage/data/taxonomy.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: homepage
      - id: deployment
        uses: actions/deploy-pages@v4
